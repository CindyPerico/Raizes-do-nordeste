server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: raizes-do-nordeste-api
  datasource:
    url: ${DB_URL:jdbc:h2:mem:raizesdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driverClassName: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console

app:
  jwt:
    secret: ${JWT_SECRET:troque-esta-chave-em-producao-com-no-minimo-32-caracteres}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  seed:
    enabled: ${SEED_ENABLED:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: ${LOG_SQL_LEVEL:info}
